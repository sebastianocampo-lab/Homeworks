<div class="app">
  <nav class="nav">
    <h1>{{ titulo }}</h1>
    <span class="tab">{{ subtitulo }}</span>

    @if (auth.estaLogueado()) {
      <div class="sesion">
        <a routerLink="/arbol" routerLinkActive="activo">Arbol</a>
        <a routerLink="/menu" routerLinkActive="activo">Menu</a>
        <span class="usuario">{{ auth.usuario() }}</span>
        <button type="button" (click)="salir()">Salir</button>
      </div>
    }
  </nav>

  <main class="pagina">
    <router-outlet />
  </main>
</div>
