<section>
  <header class="page-header">
    <h2>Challenge 04 - Pila (Stack) de libros</h2>
    <p>
      La pila trabaja con LIFO, el ultimo libro que entra es el primero que sale. Cada libro tiene
      Name, ISBN, Author y Editorial.
    </p>
  </header>

  <div class="toolbar">
    <button class="btn" (click)="sacarLibro()">pop()</button>
    <button class="btn" (click)="verTope()">peek()</button>
    <button class="btn" (click)="imprimirEnConsola()">print()</button>
    <span class="chip">size(): {{ cantidad }}</span>
    <span class="chip">isEmpty(): {{ vacia }}</span>
  </div>

  @if (mensaje) {
    <p class="message">{{ mensaje }}</p>
  }

  <div class="grid">
    <app-formulario-libro (libroCreado)="agregarLibro($event)" />
    <app-lista-libros [libros]="libros" />
  </div>
</section>
