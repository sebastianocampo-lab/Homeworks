<form class="card form" (ngSubmit)="guardar()">
  <h3>Nuevo libro</h3>

  <label>
    Name
    <input type="text" name="nombre" [(ngModel)]="nuevoLibro.nombre" placeholder="Ej: Clean Code" />
  </label>

  <label>
    ISBN
    <input type="text" name="isbn" [(ngModel)]="nuevoLibro.isbn" placeholder="Ej: 978-0132350884" />
  </label>

  <label>
    Author
    <input
      type="text"
      name="autor"
      [(ngModel)]="nuevoLibro.autor"
      placeholder="Ej: Robert C. Martin"
    />
  </label>

  <label>
    Editorial
    <input
      type="text"
      name="editorial"
      [(ngModel)]="nuevoLibro.editorial"
      placeholder="Ej: Prentice Hall"
    />
  </label>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <button type="submit" class="btn primary">push(libro)</button>
</form>
